[package]
name = "prefixr"
version = "0.2.2"
description = "A native Linux app for managing Wine and Proton prefixes to run Windows games"
authors = ["Tristan Teufel"]
license = "GPL-3.0-only"
edition = "2021"
# Tauri 3 (alpha) and its CEF runtime need 1.95.
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prefixr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "=3.0.0-alpha.4"

# The browser engine, one per build: wry builds on GTK 3, CEF on GTK 4, and both in one process
# crash. The packages (AppImage, .deb, .rpm) bring Chromium (CEF): WebKitGTK scrolls the library
# slowly, and the AppImage's bundled one stays blank or crashes on new graphics drivers
# (docs/troubleshooting.md). The Flatpak keeps WebKitGTK
# (`--no-default-features --features webkit`): it builds offline, and Chromium's sandbox has no
# user namespaces or setuid helper in there.
[features]
default = ["cef"]
cef = ["dep:tauri-runtime-cef", "tauri-plugin-dialog/xdg-portal"]
webkit = ["dep:tauri-runtime-wry", "dep:glib", "tauri-plugin-dialog/gtk3"]

[dependencies]
tauri = { version = "=3.0.0-alpha.5", features = ["tray-icon", "protocol-asset"] }
# Depending on tauri-runtime-cef is also what makes tauri-build and the CLI ship CEF.
tauri-runtime-cef = { version = "=3.0.0-alpha.6", optional = true }
tauri-runtime-wry = { version = "=3.0.0-alpha.5", optional = true }
tauri-plugin-opener = "=3.0.0-alpha.3"
# GTK 3 by default, which cannot share a process with CEF's GTK 4: the `cef` feature takes the
# XDG desktop portal (the desktop's own dialog) instead.
tauri-plugin-dialog = { version = "=3.0.0-alpha.4", default-features = false }
tauri-plugin-single-instance = "=3.0.0-alpha.3"
tauri-plugin-window-state = "=3.0.0-alpha.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "io-util", "fs", "rt", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
flate2 = "1"
xz2 = "0.1"
zstd = "0.13"
tar = "0.4"
editpe = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "ico"] }
base64 = "0.22"
sha2 = "0.10"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
# Already in the tree through tauri-plugin-single-instance; used directly to
# hand `prefixr game stop` to the window in a Flatpak (`single_instance`).
zbus = "5"
# Already in the tree through WebKitGTK's GTK 3; sets the program name, which
# becomes the window's Wayland app_id and X11 WM_CLASS, in the Flatpak.
glib = { version = "0.18", optional = true }
# Switches the X11 primary output so a game starts on Prefixr's monitor
# (`primary_output`).
x11-dl = "2"

[dev-dependencies]
tempfile = "3"
ts-rs = { version = "12", features = ["uuid-impl", "no-serde-warnings"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
