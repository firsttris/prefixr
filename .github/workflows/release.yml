name: Release

# A tag vX.Y.Z (the button in bump.yml) publishes that version: checks, Rust tests and the Tauri
# bundles (AppImage, deb, rpm), the Flatpak bundle (flatpak.yml), then the shared GitHub release
# from firsttris/workflows, which checks the tag against package.json and attaches the bundles.
# bump.yml keeps package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml on the same
# version. Run by hand on main: only the build, nothing is released. When main's CI already passed
# for the code (a release commit from bump.yml changes only versions), the checks and tests are
# skipped and only the bundles build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tested:
    uses: firsttris/workflows/.github/workflows/tested-on-main.yml@ccr-161f105b-9ns022
    permissions:
      actions: read
      contents: read

  build:
    name: Build release bundles
    needs: tested
    runs-on: ubuntu-24.04
    env:
      CEF_PATH: ${{ github.workspace }}/.cef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The packages come from the Actions cache: the Ubuntu mirror is sometimes very slow (this
      # step once took 12 minutes)
      - name: Install Linux system dependencies for Tauri
        uses: firsttris/workflows/actions/apt-install@ccr-161f105b-9ns022
        with:
          packages: |
            libgtk-4-dev
            libxdo-dev
            libssl-dev
            librsvg2-dev
            patchelf

      # Chromium (CEF, about 1 GB), which the packages bring (src-tauri/Cargo.toml)
      - name: Cache Chromium (CEF)
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-linux-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cef-linux-

      # The patched Tauri CLI (patches/README.md), built once per version and patch set
      - name: Cache the patched Tauri CLI
        uses: actions/cache@v4
        with:
          path: src-tauri/target/patched-cli
          key: patched-tauri-cli-${{ hashFiles('package.json', 'patches/*.patch') }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Already run by main's CI when tested is true
      - name: Frontend type and Svelte checks
        if: needs.tested.outputs.tested != 'true'
        run: bun run check

      - name: Frontend tests
        if: needs.tested.outputs.tested != 'true'
        run: bun run test

      - name: Rust tests
        if: needs.tested.outputs.tested != 'true'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri release bundles
        run: bun run tauri build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundles
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.sig

  flatpak:
    needs: tested
    uses: ./.github/workflows/flatpak.yml
    with:
      artifact-name: release-flatpak
      check-sources: false
    permissions:
      contents: read

  # One artifact for the release: the Tauri bundles and the .flatpak.
  assets:
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    steps:
      - name: Merge release artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: release-assets
          pattern: release-*

  release:
    needs: assets
    if: startsWith(github.ref, 'refs/tags/v')
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      release-artifact: release-assets
    permissions:
      contents: write
