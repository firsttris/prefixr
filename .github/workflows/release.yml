name: Release

# A tag vX.Y.Z (the button in bump.yml) publishes that version: checks, Rust tests and the Tauri
# bundles (AppImage, deb, rpm), then the shared GitHub release from firsttris/workflows, which
# checks the tag against package.json and attaches the bundles. bump.yml keeps package.json,
# src-tauri/tauri.conf.json and src-tauri/Cargo.toml on the same version. Run by hand on main: only
# the build, nothing is released.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release bundles
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend type and Svelte checks
        run: bun run check

      - name: Frontend tests
        run: bun run test

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri release bundles
        run: bun run tauri build

      - name: Mark AppImage as Ubuntu compatibility build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in src-tauri/target/release/bundle/appimage/*.AppImage; do
            base="${app%.AppImage}"
            new="${base}-ubuntu-compat.AppImage"
            mv "$app" "$new"

            if [ -f "${app}.sig" ]; then
              mv "${app}.sig" "${new}.sig"
            fi
            if [ -f "${app}.tar.gz" ]; then
              mv "${app}.tar.gz" "${new}.tar.gz"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: firsttris/workflows/.github/workflows/github-release.yml@v1
    with:
      release-artifact: release-assets
    permissions:
      contents: write
