name: Release (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for release tag (for example 0.2.0 or v0.2.0)
        required: true
        type: string
      prerelease:
        description: Mark release as prerelease
        required: false
        default: false
        type: boolean
      draft:
        description: Create as draft
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize and validate tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW="${INPUT_VERSION#v}"

          if ! echo "$RAW" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "Invalid version: $INPUT_VERSION"
            exit 1
          fi

          TAG="v$RAW"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG"
            exit 1
          fi

  build:
    name: Build release bundles
    needs: prepare
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend type and Svelte checks
        run: bun run check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Tauri release bundles
        run: bun run tauri build

      - name: Mark AppImage as Ubuntu compatibility build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for app in src-tauri/target/release/bundle/appimage/*.AppImage; do
            base="${app%.AppImage}"
            new="${base}-ubuntu-compat.AppImage"
            mv "$app" "$new"

            if [ -f "${app}.sig" ]; then
              mv "${app}.sig" "${new}.sig"
            fi
            if [ -f "${app}.tar.gz" ]; then
              mv "${app}.tar.gz" "${new}.tar.gz"
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.tar.gz
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.sig

  release:
    name: Publish release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create and push git tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/**/*.AppImage
            dist/**/*.AppImage.tar.gz
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.sig
