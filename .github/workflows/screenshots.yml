name: Screenshots

# Takes the pictures in docs/ (README, documentation, the Flatpak's metainfo) from the demo library
# with scripts/screenshots.sh and commits the ones that changed. Run it after a change to the look.
on:
  workflow_dispatch:

jobs:
  screenshots:
    uses: firsttris/workflows/.github/workflows/screenshots.yml@v1
    with:
      # The Bun of `packageManager` in package.json, as setup-bun takes it in ci.yml; the image has
      # npm and node, but no unzip for Bun's installer and no jq (not the workflow's `bun-version`
      # input, which would be a second place for the version)
      install: >-
        npm install --global "bun@$(node -p "require('./package.json').packageManager.split('@')[1]")"
        && bun install --frozen-lockfile
      lockfile: bun.lock
      command: bun run screenshots
      paths: docs/screenshot-*.png
    permissions:
      contents: write
