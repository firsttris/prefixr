name: CI

# Changes to documentation (and its website, see docs.yml) alone don't build.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Checks, tests and build
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    # GTK 4.14 or newer for the CEF runtime (tauri-winit-gtk4): Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      # Chromium (CEF, about 1 GB) is downloaded here once and kept in the Actions cache
      CEF_PATH: ${{ github.workspace }}/.cef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # GTK 4 for the packages' CEF build, WebKitGTK for the Flatpak's (src-tauri/Cargo.toml).
      # The packages come from the Actions cache: the Ubuntu mirror is sometimes very slow (this
      # step once took 12 minutes)
      - name: Install Linux system dependencies for Tauri
        uses: firsttris/workflows/actions/apt-install@ccr-161f105b-9ns022
        with:
          packages: |
            libgtk-4-dev
            libwebkit2gtk-4.1-dev
            libxdo-dev
            libssl-dev
            librsvg2-dev
            patchelf

      - name: Cache Chromium (CEF)
        uses: actions/cache@v4
        with:
          path: .cef
          key: cef-linux-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cef-linux-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Frontend type and Svelte checks
        run: bun run check

      - name: Frontend formatting and lints
        run: bun run lint

      - name: Frontend tests
        run: bun run test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust lints (the Flatpak's WebKitGTK build)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --no-default-features --features webkit -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      # The Rust tests regenerate the frontend's types (src/lib/types.ts).
      - name: TypeScript bindings are up to date
        run: |
          git diff --exit-code -- src/lib/bindings
          test -z "$(git status --porcelain -- src/lib/bindings)"

      - name: Frontend production build
        run: bun run build

      - name: Rust build
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --release
