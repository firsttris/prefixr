# Prefixr as a Flatpak, built from source without network access (docs/development.md#flatpak).
#
#   flatpak-builder --user --install --force-clean flatpak/build-dir \
#     flatpak/io.github.firsttris.Prefixr.yml
#
# cargo-sources.json and node-sources.json come from Cargo.lock and package-lock.json; regenerate
# them with flatpak/update-sources.sh whenever either lock file changes.
id: io.github.firsttris.Prefixr
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
  - org.freedesktop.Sdk.Extension.rust-stable
command: prefixr

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --allow=multiarch
  - --allow=devel
  - --allow=per-app-dev-shm
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/run/udev:ro
  - --filesystem=xdg-data/umu:create
  - --filesystem=~/.var/app/com.valvesoftware.Steam
  - --filesystem=xdg-config/MangoHud:ro
  - --filesystem=xdg-run/gamescope-0
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=XDG_DATA_DIRS=/app/share:/usr/lib/extensions/vulkan/share:/usr/share:/usr/share/runtime/share:/run/host/user-share:/run/host/share:/usr/lib/pressure-vessel/overrides/share
  - --env=PATH=/app/bin:/usr/bin:/usr/lib/extensions/vulkan/MangoHud/bin:/usr/lib/extensions/vulkan/gamescope/bin
  - --env=LD_LIBRARY_PATH=/usr/lib/extensions/vulkan/gamescope/lib
  - --unset-env=STEAM_RUNTIME
  - --unset-env=STEAM_RUNTIME_PREFER_HOST_LIBRARIES
  - --unset-env=SDL_VIDEODRIVER
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: "26.08"
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: "1.4"
    versions: 26.08;26.08-extra;1.4
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

modules:
  - name: bundle-setup
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/i386-linux-gnu/GL
      - install -Dm644 ld.so.conf /app/etc/ld.so.conf
    sources:
      - type: inline
        dest-filename: ld.so.conf
        contents: |
          /app/lib/i386-linux-gnu

  # Tray icon (tauri's tray-icon loads it at runtime).
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json

  # winetricks needs these for a Wine runner (Heroic builds the same three).
  - name: 7zip
    buildsystem: simple
    subdir: CPP/7zip/Bundles/Alone2
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS -f makefile.gcc CFLAGS_WARN_WALL="-Wall -Wextra"
      - install -Dm755 ./_o/7zz -t /app/bin
      - ln -s /app/bin/7zz /app/bin/7za
      - ln -s /app/bin/7zz /app/bin/7z
    sources:
      - type: git
        url: https://github.com/ip7z/7zip.git
        tag: "26.03"
        commit: 0766b733fe3e06dd2a7f9a3cfbf2108ac73abd17

  - name: cabextract
    buildsystem: simple
    subdir: cabextract
    build-commands:
      - autoreconf -I /usr/share/gettext/m4 || true
      - aclocal -I /usr/share/gettext/m4
      - automake --add-missing
      - autoreconf -I /usr/share/gettext/m4
      - ./configure --prefix $FLATPAK_DEST
      - make
      - make install
    sources:
      - type: git
        url: https://github.com/kyz/libmspack.git
        tag: v1.11
        commit: 305907723a4e7ab2018e58040059ffb5e77db837

  - name: unrar
    no-autogen: true
    make-install-args:
      - DESTDIR=$(FLATPAK_DEST)
    sources:
      - type: archive
        url: https://www.rarlab.com/rar/unrarsrc-7.3.1.tar.gz
        sha256: 634900842a3737d9cc15bbcc71d4c74cc713437e0bca296a573424fe5f2660ab

  - name: prefixr
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/node24/bin:/usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/prefixr/cargo
        CARGO_NET_OFFLINE: "true"
        XDG_CACHE_HOME: /run/build/prefixr/flatpak-node/cache
        npm_config_cache: /run/build/prefixr/flatpak-node/npm-cache
        npm_config_offline: "true"
    sources:
      # The checkout this manifest is in. Flathub would use a git source with the release tag.
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - build
          - flatpak/build-dir
          - flatpak/spike/build-dir
          - node_modules
          - src-tauri/target
          - .svelte-kit
      - node-sources.json
      - cargo-sources.json
    build-commands:
      - npm ci --offline
      - cargo --offline fetch --manifest-path src-tauri/Cargo.toml
      # tauri.conf.json builds the frontend with bun, which the SDK doesn't have.
      - npx tauri build --no-bundle --config '{"build":{"beforeBuildCommand":"npm run build"}}'
      - install -Dm755 src-tauri/target/release/prefixr /app/bin/prefixr
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.firsttris.Prefixr.png
      - install -Dm644 src-tauri/icons/64x64.png /app/share/icons/hicolor/64x64/apps/io.github.firsttris.Prefixr.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.firsttris.Prefixr.png
      - install -Dm644 src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/io.github.firsttris.Prefixr.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.firsttris.Prefixr.png
      - install -Dm644 flatpak/io.github.firsttris.Prefixr.desktop -t /app/share/applications
      - install -Dm644 flatpak/io.github.firsttris.Prefixr.metainfo.xml -t /app/share/metainfo
